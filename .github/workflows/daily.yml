name: Daily paper push

on:
  schedule:
    # 每天 UTC 01:00 = 北京时间 09:00 运行
    - cron: "0 1 * * *"
  workflow_dispatch: # 手动触发调试

permissions:
  contents: write

concurrency:
  group: paper-push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PaperPush
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
        run: python main.py

      - name: Deploy report to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # 保留历史报告，防止多天报告相互覆盖
          keep_files: true
